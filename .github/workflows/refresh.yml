name: Refresh profile

on:
  schedule:
    - cron: "17 9 * * *"  # every day, 9:17 UTC (4:17 AM Eastern)
  workflow_dispatch:  # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rewrite the parts that change
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/refresh.py
      - name: Commit if anything changed
        if: always()
        run: |
          git diff --quiet && { echo "Nothing new."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CONTRIBUTIONS.md
          git commit -m "Refresh profile from the source repos"
          git push
