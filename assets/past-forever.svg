<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Past Forever running x = 5, forever: x = x × x, show x. The number is squared again and again and its last digits turn gold as they freeze, until it shows …918212890625, which is its own square.">
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.num{font-size:84px;font-weight:700;fill:#ece8dc}
.gold{fill:#f2b01e}
.dim{fill:#5d5a66}
.code{font-size:28px;fill:#a8a4b0}
.kw{fill:#f2b01e}
.cap{font-size:26px;fill:#c8c4cc}
.dry{font-size:23px;fill:#7d7986}
@keyframes f0{0%,4.70%{opacity:1}5.00%,100%{opacity:0}}.f0{animation:f0 16.0s infinite}
@keyframes f1{0%,4.70%{opacity:0}5.00%,9.70%{opacity:1}10.00%,100%{opacity:0}}.f1{animation:f1 16.0s infinite}
@keyframes f2{0%,9.70%{opacity:0}10.00%,14.70%{opacity:1}15.00%,100%{opacity:0}}.f2{animation:f2 16.0s infinite}
@keyframes f3{0%,14.70%{opacity:0}15.00%,19.70%{opacity:1}20.00%,100%{opacity:0}}.f3{animation:f3 16.0s infinite}
@keyframes f4{0%,19.70%{opacity:0}20.00%,24.70%{opacity:1}25.00%,100%{opacity:0}}.f4{animation:f4 16.0s infinite}
@keyframes f5{0%,24.70%{opacity:0}25.00%,29.70%{opacity:1}30.00%,100%{opacity:0}}.f5{animation:f5 16.0s infinite}
@keyframes f6{0%,29.70%{opacity:0}30.00%,34.70%{opacity:1}35.00%,100%{opacity:0}}.f6{animation:f6 16.0s infinite}
@keyframes f7{0%,34.70%{opacity:0}35.00%,39.70%{opacity:1}40.00%,100%{opacity:0}}.f7{animation:f7 16.0s infinite}
@keyframes f8{0%,39.70%{opacity:0}40.00%,44.70%{opacity:1}45.00%,100%{opacity:0}}.f8{animation:f8 16.0s infinite}
@keyframes f9{0%,44.70%{opacity:0}45.00%,49.70%{opacity:1}50.00%,100%{opacity:0}}.f9{animation:f9 16.0s infinite}
@keyframes f10{0%,49.70%{opacity:0}50.00%,54.70%{opacity:1}55.00%,100%{opacity:0}}.f10{animation:f10 16.0s infinite}
@keyframes f11{0%,54.70%{opacity:0}55.00%,99.4%{opacity:1}100%{opacity:0}}.f11{animation:f11 16.0s infinite}
</style>
<rect width="1200" height="330" rx="12" fill="#0d0c10"/>
<rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="12" fill="none" stroke="#2a2830" stroke-width="1.5"/>
<g class="m">
<text x="80" y="70" class="code">x = 5</text><text x="80" y="110" class="code"><tspan class="kw">forever:</tspan> x = x × x</text><text x="80" y="150" class="code"><tspan class="kw">show</tspan> x</text>
<g class="f0"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim"></tspan><tspan></tspan><tspan class="gold">5</tspan></text><text x="80" y="262" class="cap">x = 5</text></g>
<g class="f1"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim"></tspan><tspan></tspan><tspan class="gold">25</tspan></text><text x="80" y="262" class="cap">squared 1 time</text></g>
<g class="f2"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim"></tspan><tspan></tspan><tspan class="gold">625</tspan></text><text x="80" y="262" class="cap">squared 2 times</text></g>
<g class="f3"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim"></tspan><tspan>3</tspan><tspan class="gold">90625</tspan></text><text x="80" y="262" class="cap">squared 3 times</text></g>
<g class="f4"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim"></tspan><tspan>152587</tspan><tspan class="gold">890625</tspan></text><text x="80" y="262" class="cap">squared 4 times</text></g>
<g class="f5"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim">…</tspan><tspan>38696</tspan><tspan class="gold">2890625</tspan></text><text x="80" y="262" class="cap">squared 5 times</text></g>
<g class="f6"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim">…</tspan><tspan>8557</tspan><tspan class="gold">12890625</tspan></text><text x="80" y="262" class="cap">squared 6 times</text></g>
<g class="f7"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim">…</tspan><tspan>793</tspan><tspan class="gold">212890625</tspan></text><text x="80" y="262" class="cap">squared 7 times</text></g>
<g class="f8"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim">…</tspan><tspan>66</tspan><tspan class="gold">8212890625</tspan></text><text x="80" y="262" class="cap">squared 8 times</text></g>
<g class="f9"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim">…</tspan><tspan>4</tspan><tspan class="gold">18212890625</tspan></text><text x="80" y="262" class="cap">squared 9 times</text></g>
<g class="f10"><text x="1120" y="206" class="num" text-anchor="end"><tspan class="dim">…</tspan><tspan></tspan><tspan class="gold">918212890625</tspan></text><text x="80" y="262" class="cap">squared 10 times</text></g>
<g class="f11"><text x="1120" y="206" class="num gold" text-anchor="end"><tspan class="dim">…</tspan>918212890625</text><text x="80" y="262" class="cap">x × x = x <tspan class="gold">proved</tspan></text><text x="80" y="300" class="dry">10 squarings to fix these 12 digits. the rest take forever.</text></g>
</g></svg>
